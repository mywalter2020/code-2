master_agents:
  - code: product_ops
    name: 商品运营Agent
    scene_type: product
    enabled: true
  - code: content_publish
    name: 内容分发Agent
    scene_type: content
    enabled: true
  - code: competition_builder
    name: 比赛项目Agent
    scene_type: competition
    enabled: true

ability_agents:
  - code: content_gen
    name: 内容生成Agent
    type: llm
    description: 根据输入任务生成结构化文案和内容草稿
    tags: [content, llm]
    version: v1
    enabled: true
  - code: page_gen
    name: 页面生成Agent
    type: render
    description: 生成确认页或页面预览结构
    tags: [preview, render]
    version: v1
    enabled: true
  - code: review_check
    name: 审核确认Agent
    type: review
    enabled: true
  - code: publish_exec
    name: 发布执行Agent
    type: executor
    description: 通过平台适配器执行发布动作
    tags: [publish, adapter]
    version: v1
    enabled: true
  - code: onshelf_exec
    name: 上下架执行Agent
    type: executor
    description: 通过平台适配器执行上下架动作
    tags: [shelf, adapter]
    version: v1
    enabled: true
  - code: image_gen
    name: 图像生成Agent
    type: multimodal
    enabled: true
  - code: video_gen
    name: 视频生成Agent
    type: multimodal
    enabled: true
  - code: proposal_gen
    name: 方案生成Agent
    type: llm
    enabled: true
  - code: ppt_outline
    name: PPT大纲Agent
    type: llm
    enabled: true

bindings:
  - master_agent: product_ops
    workflow:
      - step: 1
        ability: content_gen
      - step: 2
        ability: page_gen
      - step: 3
        ability: review_check
        require_human_confirm: true
      - step: 4
        ability: publish_exec
      - step: 5
        ability: onshelf_exec

  - master_agent: content_publish
    workflow:
      - step: 1
        ability: content_gen
      - step: 2
        ability: image_gen
      - step: 3
        ability: video_gen
      - step: 4
        ability: review_check
        require_human_confirm: true

  - master_agent: competition_builder
    workflow:
      - step: 1
        ability: proposal_gen
      - step: 2
        ability: ppt_outline
      - step: 3
        ability: image_gen
      - step: 4
        ability: video_gen
