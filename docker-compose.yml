services:
  postgres:
    image: postgres:16
    container_name: juyu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juyu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juyu"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: juyu-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JUYU_CONFIG: /app/configs/agents.yaml
      JUYU_STORE: postgres
      JUYU_PG_DSN: host=postgres port=5432 user=postgres password=postgres dbname=juyu sslmode=disable timezone=Asia/Shanghai
      JUYU_API_KEY: ${JUYU_API_KEY:-}
      JUYU_ADAPTER_DRY_RUN: ${JUYU_ADAPTER_DRY_RUN:-true}
      JUYU_ALIBABA_APP_KEY: ${JUYU_ALIBABA_APP_KEY:-}
      JUYU_ALIBABA_SECRET: ${JUYU_ALIBABA_SECRET:-}
      JUYU_ALIBABA_BASE_URL: ${JUYU_ALIBABA_BASE_URL:-}
      JUYU_ALIBABA_SIGN_METHOD: ${JUYU_ALIBABA_SIGN_METHOD:-md5}
      JUYU_ALIBABA_VERSION: ${JUYU_ALIBABA_VERSION:-2.0}
      JUYU_ALIBABA_REQUEST_FORMAT: ${JUYU_ALIBABA_REQUEST_FORMAT:-json}
      JUYU_ALIBABA_AUTH_PLACEMENT: ${JUYU_ALIBABA_AUTH_PLACEMENT:-body}
      JUYU_ALIBABA_INCLUDE_APP_KEY: ${JUYU_ALIBABA_INCLUDE_APP_KEY:-true}
      JUYU_ALIBABA_INCLUDE_VERSION: ${JUYU_ALIBABA_INCLUDE_VERSION:-true}
      JUYU_ALIBABA_PUBLISH_METHOD: ${JUYU_ALIBABA_PUBLISH_METHOD:-}
      JUYU_ALIBABA_UPDATE_METHOD: ${JUYU_ALIBABA_UPDATE_METHOD:-}
      JUYU_ALIBABA_ON_SHELF_METHOD: ${JUYU_ALIBABA_ON_SHELF_METHOD:-}
      JUYU_ALIBABA_OFF_SHELF_METHOD: ${JUYU_ALIBABA_OFF_SHELF_METHOD:-}
      JUYU_ALIBABA_PUBLISH_PATH: ${JUYU_ALIBABA_PUBLISH_PATH:-}
      JUYU_ALIBABA_UPDATE_PATH: ${JUYU_ALIBABA_UPDATE_PATH:-}
      JUYU_ALIBABA_ON_SHELF_PATH: ${JUYU_ALIBABA_ON_SHELF_PATH:-}
      JUYU_ALIBABA_OFF_SHELF_PATH: ${JUYU_ALIBABA_OFF_SHELF_PATH:-}
      JUYU_ALIBABA_TIMEOUT_MS: ${JUYU_ALIBABA_TIMEOUT_MS:-30000}
      JUYU_ALIBABA_RETRY_ATTEMPTS: ${JUYU_ALIBABA_RETRY_ATTEMPTS:-1}
      JUYU_ALIBABA_RETRY_DELAY_MS: ${JUYU_ALIBABA_RETRY_DELAY_MS:-500}
      JUYU_TAOBAO_APP_KEY: ${JUYU_TAOBAO_APP_KEY:-}
      JUYU_TAOBAO_SECRET: ${JUYU_TAOBAO_SECRET:-}
      JUYU_TAOBAO_BASE_URL: ${JUYU_TAOBAO_BASE_URL:-}
      JUYU_TAOBAO_SIGN_METHOD: ${JUYU_TAOBAO_SIGN_METHOD:-md5}
      JUYU_TAOBAO_VERSION: ${JUYU_TAOBAO_VERSION:-2.0}
      JUYU_TAOBAO_REQUEST_FORMAT: ${JUYU_TAOBAO_REQUEST_FORMAT:-json}
      JUYU_TAOBAO_AUTH_PLACEMENT: ${JUYU_TAOBAO_AUTH_PLACEMENT:-body}
      JUYU_TAOBAO_PUBLISH_METHOD: ${JUYU_TAOBAO_PUBLISH_METHOD:-}
      JUYU_TAOBAO_UPDATE_METHOD: ${JUYU_TAOBAO_UPDATE_METHOD:-}
      JUYU_TAOBAO_ON_SHELF_METHOD: ${JUYU_TAOBAO_ON_SHELF_METHOD:-}
      JUYU_TAOBAO_OFF_SHELF_METHOD: ${JUYU_TAOBAO_OFF_SHELF_METHOD:-}
      JUYU_TAOBAO_PUBLISH_PATH: ${JUYU_TAOBAO_PUBLISH_PATH:-}
      JUYU_TAOBAO_UPDATE_PATH: ${JUYU_TAOBAO_UPDATE_PATH:-}
      JUYU_TAOBAO_ON_SHELF_PATH: ${JUYU_TAOBAO_ON_SHELF_PATH:-}
      JUYU_TAOBAO_OFF_SHELF_PATH: ${JUYU_TAOBAO_OFF_SHELF_PATH:-}
      JUYU_DOUYIN_CLIENT_ID: ${JUYU_DOUYIN_CLIENT_ID:-}
      JUYU_DOUYIN_CLIENT_SECRET: ${JUYU_DOUYIN_CLIENT_SECRET:-}
      JUYU_DOUYIN_BASE_URL: ${JUYU_DOUYIN_BASE_URL:-}
      NVIDIA_URL: ${NVIDIA_URL:-}
      NVIDIA_KEY: ${NVIDIA_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-405b-instruct}
      OPENAI_COMPAT_URL: ${OPENAI_COMPAT_URL:-}
      OPENAI_COMPAT_KEY: ${OPENAI_COMPAT_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      CONTENT_GEN_PROVIDER: ${CONTENT_GEN_PROVIDER:-nvidia}
      CONTENT_GEN_MODEL: ${CONTENT_GEN_MODEL:-meta/llama-3.1-405b-instruct}
      CONTENT_GEN_TEMPERATURE: ${CONTENT_GEN_TEMPERATURE:-0.4}
      CONTENT_GEN_MAX_TOKENS: ${CONTENT_GEN_MAX_TOKENS:-220}
      CONTENT_GEN_SYSTEM_PROMPT: ${CONTENT_GEN_SYSTEM_PROMPT:-你擅长生成电商商品发布文案，输出准确、简洁、可直接使用。}
      CONTENT_GEN_PROMPT_TEMPLATE: ${CONTENT_GEN_PROMPT_TEMPLATE:-你是电商运营文案助手。请为以下商品生成一段简洁但可直接用于发布页的中文商品文案，控制在120字内。输出纯文本，不要加标题。商品标题：{{title}}。商品描述：{{description}}。目标平台：{{platform}}。}
      PAGE_GEN_PROVIDER: ${PAGE_GEN_PROVIDER:-stub}
      PAGE_GEN_MODEL: ${PAGE_GEN_MODEL:-meta/llama-3.1-405b-instruct}
      PAGE_GEN_TEMPERATURE: ${PAGE_GEN_TEMPERATURE:-0.3}
      PAGE_GEN_MAX_TOKENS: ${PAGE_GEN_MAX_TOKENS:-260}
      PAGE_GEN_SYSTEM_PROMPT: ${PAGE_GEN_SYSTEM_PROMPT:-你擅长生成电商商品页面结构，输出 JSON，字段必须稳定。}
      PAGE_GEN_PROMPT_TEMPLATE: ${PAGE_GEN_PROMPT_TEMPLATE:-请基于以下商品信息生成一个 JSON 页面草图。字段必须包含 title 和 sections，sections 为字符串数组。不要输出 markdown，不要输出解释。商品标题：{{title}}。商品描述：{{description}}。目标平台：{{platform}}。}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
