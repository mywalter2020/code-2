services:
  postgres:
    image: postgres:16
    container_name: juyu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juyu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juyu"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: juyu-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JUYU_CONFIG: /app/configs/agents.yaml
      JUYU_STORE: postgres
      JUYU_PG_DSN: host=postgres port=5432 user=postgres password=postgres dbname=juyu sslmode=disable timezone=Asia/Shanghai
      JUYU_API_KEY: ${JUYU_API_KEY:-}
      JUYU_ADAPTER_DRY_RUN: ${JUYU_ADAPTER_DRY_RUN:-true}
      JUYU_ALIBABA_APP_KEY: ${JUYU_ALIBABA_APP_KEY:-}
      JUYU_ALIBABA_SECRET: ${JUYU_ALIBABA_SECRET:-}
      JUYU_TAOBAO_APP_KEY: ${JUYU_TAOBAO_APP_KEY:-}
      JUYU_TAOBAO_SECRET: ${JUYU_TAOBAO_SECRET:-}
      JUYU_DOUYIN_CLIENT_ID: ${JUYU_DOUYIN_CLIENT_ID:-}
      JUYU_DOUYIN_CLIENT_SECRET: ${JUYU_DOUYIN_CLIENT_SECRET:-}
      NVIDIA_URL: ${NVIDIA_URL:-}
      NVIDIA_KEY: ${NVIDIA_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-405b-instruct}
      CONTENT_GEN_PROVIDER: ${CONTENT_GEN_PROVIDER:-nvidia}
      CONTENT_GEN_TEMPERATURE: ${CONTENT_GEN_TEMPERATURE:-0.4}
      CONTENT_GEN_MAX_TOKENS: ${CONTENT_GEN_MAX_TOKENS:-220}
      CONTENT_GEN_SYSTEM_PROMPT: ${CONTENT_GEN_SYSTEM_PROMPT:-你擅长生成电商商品发布文案，输出准确、简洁、可直接使用。}
      CONTENT_GEN_PROMPT_TEMPLATE: ${CONTENT_GEN_PROMPT_TEMPLATE:-你是电商运营文案助手。请为以下商品生成一段简洁但可直接用于发布页的中文商品文案，控制在120字内。输出纯文本，不要加标题。商品标题：{{title}}。商品描述：{{description}}。目标平台：{{platform}}。}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
