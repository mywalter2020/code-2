openapi: 3.0.3
info:
  title: JuYu AI Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /abilities:
    get:
      summary: List ability agents
      responses:
        '200':
          description: OK
  /execute:
    post:
      summary: Execute a scene task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: Task accepted or completed
  /tasks:
    get:
      summary: List tasks
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: scene
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        '200':
          description: Task list
  /tasks/summary:
    get:
      summary: Get task summary statistics
      responses:
        '200':
          description: Task summary
  /tasks/{taskId}:
    get:
      summary: Get task detail
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task detail
  /tasks/{taskId}/preview:
    get:
      summary: Get task preview
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task preview
  /tasks/{taskId}/logs:
    get:
      summary: Get task logs
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task logs
  /tasks/{taskId}/status:
    get:
      summary: Get task status summary
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task status
  /tasks/{taskId}/confirm:
    post:
      summary: Confirm or reject task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated task
  /tasks/{taskId}/cancel:
    post:
      summary: Cancel task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated task
  /tasks/{taskId}/retry:
    post:
      summary: Retry task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated task
components:
  schemas:
    Request:
      type: object
      properties:
        scene:
          type: string
        input:
          type: string
        payload:
          type: object
          additionalProperties: true
